<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>即時跟車系統 V2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#101419;--panel:#171c22;--muted:#a9b4bf;--blue:#3997ff;--green:#29c363;--red:#ff666c}*{box-sizing:border-box}html,body{height:100%;margin:0;padding:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#map{position:fixed;inset:0;height:100%;width:100%;z-index:1}.top{position:absolute;z-index:1000;top:12px;left:12px;right:12px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}.pill{background:#171b20ed;border:1px solid #ffffff1b;border-radius:14px;padding:9px 12px;box-shadow:0 3px 14px #0004}.pill small{display:block;color:var(--muted);font-size:11px}.pill strong{font-size:14px}.speed{position:absolute;z-index:1000;right:14px;bottom:145px;width:90px;height:90px;border-radius:50%;background:var(--green);border:4px solid #e2ffec;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#082414;box-shadow:0 5px 20px #0005}.speed b{font-size:27px}.speed span{font-size:12px;font-weight:800}.bottom{position:absolute;z-index:1000;bottom:12px;left:12px;right:12px;background:#171c22ed;border:1px solid #ffffff20;border-radius:18px;padding:12px;box-shadow:0 4px 20px #0005}.people{display:flex;gap:12px;justify-content:space-between;margin-bottom:10px}.person{flex:1;display:flex;gap:9px;align-items:center;min-width:0}.dot{width:11px;height:11px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px #3997ff20;flex:none}.dot.red{background:var(--red);box-shadow:0 0 0 4px #ff666c20}.person b{display:block;font-size:14px}.person small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:8px}.btn{border:0;border-radius:12px;background:#3269f3;color:white;font-weight:750;padding:12px 13px;flex:1;font-size:14px}.btn.secondary{background:#303943}.btn.green{background:#158848}.notice{position:absolute;z-index:1000;top:78px;left:50%;transform:translateX(-50%);background:#202831e8;border:1px solid #ffffff18;border-radius:12px;padding:8px 12px;font-size:12px;max-width:90%;text-align:center}.roomBadge{position:absolute;z-index:1000;top:122px;left:50%;transform:translateX(-50%);background:#151a20ed;border:1px solid #ffffff24;border-radius:13px;padding:7px 12px;font-size:12px;white-space:nowrap}.sheet{position:fixed;z-index:3000;inset:0;background:#0009;display:none;align-items:flex-end}.sheet.show{display:flex}.modal{width:100%;max-height:90dvh;overflow:auto;background:#171c22;border-radius:22px 22px 0 0;padding:18px 16px 26px;border:1px solid #ffffff18}.modal h2{margin:0 0 8px;font-size:20px}.modal p{margin:0 0 12px;color:#c1cad3;font-size:13px;line-height:1.55}.input{width:100%;padding:13px;border-radius:12px;border:1px solid #ffffff24;background:#0f1317;color:white;font-size:16px;margin:7px 0 12px}.small{font-size:12px;color:var(--muted);line-height:1.55}.modal .btn{margin:5px 0;width:100%;flex:none}.x{float:right;background:#343d47;border:0;color:white;border-radius:9px;padding:8px 11px}.leaflet-control-attribution{font-size:9px!important}
</style></head><body>
<div id="map"></div>
<div class="top"><div class="pill"><small>即時跟車系統 V2</small><strong id="status">未加入車隊</strong></div><div class="pill"><small>車隊距離</small><strong id="distance">-- m</strong></div></div>
<div class="notice" id="notice">建立車隊或輸入房間代碼加入</div><div class="roomBadge" id="roombadge">房間：尚未加入</div>
<div class="speed"><b id="speed">--</b><span>km/h</span></div>
<div class="bottom"><div class="people"><div class="person"><span class="dot"></span><div><b id="meName">本人</b><small id="meInfo">尚未分享位置</small></div></div><div class="person"><span class="dot red"></span><div><b>隊友</b><small id="peerInfo">等待隊友加入</small></div></div></div><div class="actions"><button class="btn green" id="shareGps">開始分享 GPS</button><button class="btn secondary" id="roomSettings">車隊 / 設定</button></div></div>
<div class="sheet" id="sheet"><div class="modal"><button class="x" id="close">關閉</button><h2>車隊設定</h2><p>兩支手機輸入同一個房間代碼，就能在地圖上互相看見位置。建立房間後分享連結給隊友即可。</p><label class="small">你的顯示名稱</label><input class="input" id="displayName" maxlength="18" placeholder="例如：小王 / 車1"><label class="small">房間代碼（3–12 位英數字）</label><input class="input" id="roomCode" maxlength="12" placeholder="例如：ROAD123"><button class="btn green" id="createRoom">建立新車隊</button><button class="btn" id="joinRoom">加入車隊</button><button class="btn secondary" id="shareLink">分享加入連結</button><p class="small" style="margin-top:12px">位置分享須由每位參與者自行同意。GPS 更新需要 HTTPS 網頁與瀏覽器定位權限。請勿將此頁用於未經同意追蹤他人。</p></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getDatabase,ref,set,onValue,remove} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
import {getAuth,signInAnonymously} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const DEFAULT_CONFIG = {
  apiKey: "AIzaSyBCFB8AIDl7QIs7t35TTtvW1twG4S6-bp0",
  authDomain: "live-follow-2633d.firebaseapp.com",
  databaseURL: "https://live-follow-2633d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "live-follow-2633d",
  storageBucket: "live-follow-2633d.firebasestorage.app",
  messagingSenderId: "521304626744",
  appId: "1:521304626744:web:176c97f0bb10dca3c9f8cd"
};

const map=L.map('map').setView([23.0,120.2],16);
L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}',{maxZoom:19,attribution:'© 內政部國土測繪中心'}).addTo(map);
setTimeout(()=>map.invalidateSize(),300);

let app,db,auth,user=null,room='',myMarker,peerMarkers={},gpsWatch=null,peerData={},membersRef=null,wakeLock=null;
const $=id=>document.getElementById(id);

async function requestWakeLock(){
  if('wakeLock' in navigator){
    try{
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
    }catch(e){}
  }
}
function releaseWakeLock(){
  if(wakeLock){
    wakeLock.release().catch(()=>{});
    wakeLock = null;
  }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && gpsWatch !== null){
    requestWakeLock();
  }
});

function markerIcon(color,name){return L.divIcon({className:'',html:`<div style="font-size:24px;background:#fff;border:3px solid ${color};border-radius:9px;padding:2px 5px;box-shadow:0 2px 8px #0005">🚙</div><div style="font-size:11px;background:#20252c;color:#fff;border-radius:8px;padding:2px 5px;text-align:center;margin-top:1px">${escapeHtml(name)}</div>`,iconSize:[48,45],iconAnchor:[24,20]})}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setNotice(s){$('notice').textContent=s}
function connectFirebase(config){app=initializeApp(config);db=getDatabase(app);auth=getAuth(app);return signInAnonymously(auth).then(c=>{user=c.user;return user;});}
async function ensureConnected(){if(db&&user)return true;try{await connectFirebase(DEFAULT_CONFIG);return true;}catch(e){setNotice('Firebase 連線失敗：請檢查匿名登入或資料庫規則');return false;}}
function openSheet(){ $('sheet').classList.add('show'); }
$('roomSettings').onclick=openSheet;$('close').onclick=()=> $('sheet').classList.remove('show');$('sheet').onclick=e=>{if(e.target===$('sheet'))$('sheet').classList.remove('show')};
function randomRoom(){return Math.random().toString(36).slice(2,8).toUpperCase()}
async function enterRoom(code,create){if(!/^[A-Z0-9]{3,12}$/.test(code)){setNotice('房間代碼請使用 3–12 位英數字');return;}if(!await ensureConnected())return;room=code;const roomRef=ref(db,`rooms/${room}/members/${user.uid}`);const display=$('displayName').value.trim()||'車友';await set(roomRef,{name:display,joinedAt:Date.now()});$('meName').textContent=display+'（本人）';$('roombadge').textContent='房間：'+room;$('status').textContent='已加入車隊';$('sheet').classList.remove('show');setNotice(create?'車隊建立成功，請分享連結給隊友':'已加入車隊，等待隊友位置');$('shareGps').textContent='開始分享 GPS';listenRoom();}
$('createRoom').onclick=()=>{const code=($('roomCode').value.trim().toUpperCase()||randomRoom());$('roomCode').value=code;enterRoom(code,true)};
$('joinRoom').onclick=()=>enterRoom($('roomCode').value.trim().toUpperCase(),false);
$('shareLink').onclick=async()=>{if(!room){setNotice('先建立或加入車隊');return;}const url=new URL(location.href);url.searchParams.set('room',room);try{await navigator.clipboard.writeText(url.href);setNotice('加入連結已複製！傳給隊友即可');}catch{prompt('複製這個連結給隊友：',url.href)}};
function listenRoom(){if(membersRef)membersRef=null;const allRef=ref(db,`rooms/${room}/members`);onValue(allRef,snap=>{const members=snap.val()||{};peerData=members;renderPeers(members);});}
function renderPeers(members){const others=Object.entries(members).filter(([id])=>id!==user?.uid);if(!others.length){$('peerInfo').textContent='等待隊友加入';$('distance').textContent='-- m';Object.values(peerMarkers).forEach(m=>map.removeLayer(m));peerMarkers={};return;}const [id,p]=others[0];$('peerInfo').textContent=p?.lat!=null?`${p.name||'隊友'} · ${p.speed==null?'--':Math.round(p.speed*3.6)+' km/h'}`:`${p.name||'隊友'} · 尚未分享 GPS`;for(const [pid,p] of others){if(p.lat==null||p.lon==null)continue;const ll=[p.lat,p.lon];if(!peerMarkers[pid])peerMarkers[pid]=L.marker(ll,{icon:markerIcon('#ff6262',p.name||'隊友')}).addTo(map);else peerMarkers[pid].setLatLng(ll);if(myMarker){const own=myMarker.getLatLng();const d=map.distance(own,ll);$('distance').textContent=Math.round(d)+' m';}}if(myMarker&&others[0]?.lat!=null){const myll=myMarker.getLatLng();const pll=[others[0][1].lat,others[0][1].lon];map.fitBounds([myll,pll],{padding:[65,65],maxZoom:18});}}
function updateOwnPosition(coords){const lat=coords.latitude,lon=coords.longitude,speed=coords.speed;const ll=[lat,lon];if(!myMarker){myMarker=L.marker(ll,{icon:markerIcon('#3398ff',$('meName').textContent)}).addTo(map);map.setView(ll,16);}else myMarker.setLatLng(ll);$('speed').textContent=speed==null?'--':Math.round(speed*3.6);$('meInfo').textContent='GPS 更新中 · '+(speed==null?'速度未知':Math.round(speed*3.6)+' km/h');if(room&&db&&user){set(ref(db,`rooms/${room}/members/${user.uid}`),{name:$('displayName').value.trim()||$('meName').textContent.replace('（本人）',''),lat,lon,speed:speed??null,heading:coords.heading??null,accuracy:coords.accuracy,timestamp:Date.now()}).catch(e=>setNotice('位置上傳錯誤：'+e.message));}renderPeers(peerData);}
$('shareGps').onclick=async()=>{
  if(!room){openSheet();setNotice('請先建立或加入車隊');return;}
  if(!navigator.geolocation){setNotice('此瀏覽器不支援 GPS 定位');return;}
  if(gpsWatch!==null){
    navigator.geolocation.clearWatch(gpsWatch);
    gpsWatch=null;
    releaseWakeLock();
    $('shareGps').textContent='開始分享 GPS';
    $('meInfo').textContent='已停止分享';
    setNotice('已停止分享位置（已解除螢幕恆亮）');
    if(user&&db)remove(ref(db,`rooms/${room}/members/${user.uid}/lat`));
    return;
  }
  if(!await ensureConnected())return;
  await requestWakeLock();
  gpsWatch=navigator.geolocation.watchPosition(p=>{
    updateOwnPosition(p.coords);
    $('status').textContent='GPS 分享中';
    setNotice(wakeLock ? '位置同步中（螢幕已保持恆亮）' : '位置正在同步給同車隊成員');
    $('shareGps').textContent='停止分享 GPS';
  },err=>{
    releaseWakeLock();
    setNotice('定位錯誤：請允許定位並確認網頁使用 HTTPS');
    $('status').textContent='定位失敗';
  },{enableHighAccuracy:true,maximumAge:1500,timeout:15000});
};
const params=new URLSearchParams(location.search);if(params.get('room')){$('roomCode').value=params.get('room').toUpperCase();openSheet();setNotice('已帶入車隊代碼，輸入名稱後加入');}
</script>
</body></html>
